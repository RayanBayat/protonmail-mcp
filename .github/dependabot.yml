version: 2

# The runtime is a single pinned npm dependency set (mailbox-mcp/). Grouping
# weekly keeps review noise low while still surfacing security updates.
updates:
  - package-ecosystem: npm
    directory: "/mailbox-mcp"
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
