version: 2

# A single pinned dependency set at the repository root, locked by
# pnpm-lock.yaml. Grouping weekly keeps review noise low while still
# surfacing security updates.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
